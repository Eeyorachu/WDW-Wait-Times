<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎢 WDW Live Wait Times</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#17324d;color:#fff;padding:18px;text-align:center}h1{margin:0 0 6px;font-size:26px}#updated{font-size:13px;opacity:.85}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;max-width:1100px;margin:auto}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#fff;box-shadow:0 1px 4px #bbb;cursor:pointer}button.active{background:#17324d;color:#fff}#refresh{margin-left:auto}main{max-width:1100px;margin:auto;padding:0 12px 30px}.park{margin:18px 0}.park h2{margin:0 0 8px}.card{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;margin:7px 0;padding:12px 14px;box-shadow:0 1px 4px #ddd}.name{font-weight:600}.wait{font-size:20px;font-weight:800;white-space:nowrap}.small{display:block;color:#68737d;font-size:12px;margin-top:3px}.closed{opacity:.55}.error{background:#fff0f0;padding:14px;border-radius:10px;margin-top:12px}.credit{text-align:center;color:#68737d;font-size:12px;padding:15px}</style></head><body><header><h1>🎢 WDW Live Wait Times</h1><div id="updated">Loading…</div></header><nav><button class="active" data-park="all">🎢 All Parks</button><button data-park="Magic Kingdom">🏰 Magic Kingdom</button><button data-park="EPCOT">🌐 EPCOT</button><button data-park="Hollywood Studios">🎬 Hollywood Studios</button><button data-park="Animal Kingdom">🦁 Animal Kingdom</button><button id="refresh">🔄 Refresh</button><button onclick="location.href='wdw_reservations.html'">🎟️ Reservations</button><button onclick="location.href='disney_springs_happy_hour.html'">🍹 Happy Hour</button></nav><main id="app"></main><div class="credit">Powered by ThemeParks.wiki</div><script>
const parks={
 "Magic Kingdom":"75ea578a-adc8-4116-a54d-dccb60765ef9",
 "Hollywood Studios":"288747d1-8b4f-4a64-867e-ea7c9b27bad8",
 "Animal Kingdom":"1c84a229-8862-4648-9c71-378ddd2c7693",
 "EPCOT":"47f90d2c-e191-4239-a466-5892ef59a88b"
};
const iconRules=[['safari','🦒'],['kilimanjaro','🦒'],['everest','🏔️'],['kali','💦'],['na’vi','🌌'],['navi','🌌'],['flight of passage','🪽'],['space mountain','🚀'],['seven dwarfs','⛏️'],['thunder','🚂'],['pirates','🏴‍☠️'],['haunted','👻'],['tron','🏍️'],['peter pan','🧚'],['dumbo','🐘'],['barnstormer','✈️'],['small world','🌎'],['magic carpets','🧞'],['belle','🌹'],['soarin','🛫'],['nemo','🐠'],['test track','🏎️'],['guardians','🚀'],['frozen','❄️'],['ratatouille','🐀'],['slinky','🐕'],['rise of the resistance','⭐'],['millennium falcon','🚀'],['runaway railway','🚂'],['tower of terror','🏨'],['toy story','🤠'],['star tours','🌌'],['alien swirling','👽'],['rock ’n’ roller','🎸'],["rock 'n' roller",'🎸'],['buzz','🔫']];
let selected='all',data={};const app=document.getElementById('app');
function icon(n){const s=n.toLowerCase();for(const [k,v] of iconRules)if(s.includes(k))return v;return '🎢'}
async function fetchPark(id){const r=await fetch('https://api.themeparks.wiki/v1/entity/'+id+'/live',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
function render(){app.innerHTML='';const ps=selected==='all'?Object.keys(parks):[selected];for(const p of ps){const sec=document.createElement('section');sec.className='park';sec.innerHTML='<h2>'+p+'</h2>';const rows=data[p]||[];if(!rows.length){sec.innerHTML+='<div class="error">No data loaded. If you opened this by double-clicking the HTML file, use <b>Run WDW Wait Times.bat</b> instead.</div>';app.appendChild(sec);continue}const a=rows.filter(x=>(x.entityType==='ATTRACTION'||x.meta?.type==='ATTRACTION'||x.type==='ATTRACTION')).sort((a,b)=>{const aw=a.waitTime??a.queue?.STANDBY?.waitTime??-1;const bw=b.waitTime??b.queue?.STANDBY?.waitTime??-1;return bw-aw;});for(const x of a){const wait=x.waitTime??x.queue?.STANDBY?.waitTime??null;const status=x.status||'Unknown';const row=document.createElement('div');row.className='card '+(status!=='OPERATING'&&status!=='Operating'?'closed':'');row.innerHTML='<div class="name">'+icon(x.name)+' '+x.name+'<span class="small">'+status+'</span></div><div class="wait">'+(wait==null?(status.toUpperCase()==='DOWN'?'DOWN':status.toUpperCase()==='CLOSED'?'CLOSED':'—'):wait+' min')+'</div>';sec.appendChild(row)}app.appendChild(sec)}}
async function load(){document.getElementById('updated').textContent='Updating…';const results=await Promise.all(Object.entries(parks).map(async([p,id])=>{try{return [p,(await fetchPark(id)).liveData||[]]}catch(e){return [p,[]]}}));data=Object.fromEntries(results);const good=Object.values(data).some(x=>x.length);document.getElementById('updated').textContent=good?'Live feed • refreshed '+new Date().toLocaleTimeString():'Could not connect to the live feed';render()}
document.querySelectorAll('[data-park]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-park]').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.park;render()});document.getElementById('refresh').onclick=load;load();setInterval(load,300000);
</script></body></html>
